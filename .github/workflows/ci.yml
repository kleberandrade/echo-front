name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test (inclui golden replays e e2e de séries)
        run: pnpm test

  smoke:
    # Smoke visual: reproduz o replay demo no Chromium, faz scrub até o fim e
    # valida o placar + o finalHash re-simulado no browser (paridade Node×browser).
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install Chromium (Playwright)
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Smoke do replay no browser
        working-directory: apps/web
        run: node scripts/smoke.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: apps/web/screenshots/
          if-no-files-found: ignore
