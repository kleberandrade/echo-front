name: echo_front_agent_sdk
description: >-
  Dart WebSocket agent client for the ECHO//FRONT tactical arena, with
  perception callbacks, decisions and bounded reconnection.
version: 0.1.0
homepage: https://github.com/kleberandrade/echo-front/tree/main/packages/agents-sdk-dart
repository: https://github.com/kleberandrade/echo-front
issue_tracker: https://github.com/kleberandrade/echo-front/issues
documentation: https://github.com/kleberandrade/echo-front/blob/main/docs/04-protocolo-agente.md
topics:
  - websocket
  - game-ai

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  web_socket_channel: ^3.0.3

dev_dependencies:
  async: ^2.13.1
  lints: ^6.1.0
  test: ^1.33.0
