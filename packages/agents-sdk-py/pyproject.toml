[project]
name = "echo-front-agent-sdk"
version = "0.1.0"
description = "SDK Python para escrever agentes do ECHO//FRONT (equivalente ao @echo-front/agents-sdk em TypeScript)."
readme = "README.md"
license = "MIT"
authors = [{ name = "Kleber Andrade" }]
requires-python = ">=3.10"
keywords = ["echo-front", "ai-agents", "bot-sdk", "websocket"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment",
  "Framework :: AsyncIO",
]
dependencies = ["websockets>=12"]

[project.urls]
Homepage = "https://github.com/kleberandrade/echo-front/tree/main/packages/agents-sdk-py#readme"
Repository = "https://github.com/kleberandrade/echo-front"
Issues = "https://github.com/kleberandrade/echo-front/issues"
Documentation = "https://github.com/kleberandrade/echo-front/blob/main/docs/04-protocolo-agente.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/echo_front_agent_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
